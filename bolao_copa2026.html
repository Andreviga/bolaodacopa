  <style>
    :root {
      --bg: #0A0E1A;
      --panel: #141926;
      --panel-2: #101521;
      --line: #2A3050;
      --text: #F0F4FF;
      --muted: #AAB3CF;
      --gold: #FFD700;
      --green: #00C896;
      --red: #FF5C7A;
      --blue: #4DA3FF;
      --shadow: 0 18px 50px rgba(0, 0, 0, .28);
      color-scheme: dark;
      font-family: "DM Sans", "Nunito", system-ui, -apple-system, Segoe UI, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 18% 12%, rgba(0, 200, 150, .16), transparent 30%),
        radial-gradient(circle at 86% 4%, rgba(255, 215, 0, .12), transparent 25%),
        var(--bg);
      background-size: 44px 44px, 44px 44px, auto, auto, auto;
    }

    body.light {
      --bg: #F5F7FB;
      --panel: #FFFFFF;
      --panel-2: #EDF2F8;
      --line: #D7DDEA;
      --text: #111827;
      --muted: #596274;
      --shadow: 0 18px 50px rgba(20, 25, 38, .13);
      color-scheme: light;
    }

    button, input, select, textarea { font: inherit; }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-2);
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: var(--panel-2);
    }
    input, select { min-height: 44px; padding: 0 12px; }
    textarea { min-height: 82px; padding: 10px 12px; resize: vertical; }
    input[type="number"] { text-align: center; }

    .app {
      display: grid;
      min-height: 100vh;
      grid-template-rows: auto 1fr auto;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(10, 14, 26, .88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    body.light .topbar { background: rgba(245, 247, 251, .9); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--gold), var(--green));
      color: #0A0E1A;
      font-weight: 900;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(1.1rem, 3.8vw, 1.65rem);
      line-height: 1;
      letter-spacing: 0;
      font-family: Impact, "Barlow Condensed", "Arial Narrow", sans-serif;
    }
    .brand small { color: var(--muted); display: block; margin-top: 3px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn { width: 44px; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); }
    .layout { display: grid; grid-template-columns: 1fr; }
    .sidebar { display: none; }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 16px 16px 92px; }
    .screen { display: none; animation: fade .2s ease; }
    .screen.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .hero {
      display: grid;
      gap: 20px;
      padding: 24px 0;
      min-height: calc(100vh - 160px);
      align-content: center;
    }
    .hero h2 {
      margin: 0;
      max-width: 760px;
      font-family: Impact, "Barlow Condensed", "Arial Narrow", sans-serif;
      font-size: clamp(2.4rem, 12vw, 6.2rem);
      line-height: .92;
      letter-spacing: 0;
    }
    .hero p { margin: 0; max-width: 620px; color: var(--muted); font-size: 1.05rem; }
    .front-info {
      display: grid;
      gap: 12px;
      max-width: 860px;
      grid-template-columns: 1fr;
    }
    .rule-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .rule-list li {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 8px;
      align-items: start;
      color: var(--muted);
      line-height: 1.35;
    }
    .rule-list b { color: var(--text); }
    .rule-dot {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 215, 0, .16);
      color: var(--gold);
      font-size: .75rem;
      font-weight: 900;
    }
    .install-box {
      display: grid;
      gap: 10px;
      border: 1px solid rgba(0, 200, 150, .42);
      background: linear-gradient(135deg, rgba(0, 200, 150, .14), rgba(77, 163, 255, .08));
    }
    .install-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .login-grid { display: grid; gap: 12px; grid-template-columns: 1fr; max-width: 760px; }
    .login-card { display: grid; gap: 12px; }
    .identity-confirm {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
    }
    .identity-name {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--gold);
    }
    .identity-actions { display: grid; gap: 8px; grid-template-columns: 1fr; }
    .primary { background: linear-gradient(135deg, var(--gold), #FFB000); color: #101521; font-weight: 800; }
    .success { background: linear-gradient(135deg, var(--green), #11A8FF); color: #07131B; font-weight: 800; }
    .danger { background: rgba(255, 92, 122, .15); color: var(--red); border: 1px solid rgba(255,92,122,.35); }

    .grid { display: grid; gap: 14px; }
    .grid.two { grid-template-columns: 1fr; }
    .grid.three { grid-template-columns: 1fr; }
    .panel {
      background: rgba(20, 25, 38, .94);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    body.light .panel { background: rgba(255,255,255,.95); }
    .panel h2, .panel h3 { margin: 0 0 12px; letter-spacing: 0; }
    .panel h2 { font-size: 1.35rem; }
    .panel h3 { font-size: 1rem; color: var(--muted); font-weight: 700; }
    .stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
    }
    .stat b { display: block; font-size: 1.55rem; }
    .stat span { color: var(--muted); font-size: .88rem; }
    .alert-list {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }
    .alert-item {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
      align-items: start;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
    }
    .alert-icon {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 999px;
      font-weight: 900;
      font-size: .85rem;
      background: rgba(255,255,255,.08);
    }
    .alert-item strong { display: block; margin-bottom: 2px; }
    .alert-item span { color: var(--muted); font-size: .88rem; line-height: 1.35; }
    .alert-error { border-color: rgba(255, 92, 122, .45); }
    .alert-error .alert-icon { color: var(--red); background: rgba(255, 92, 122, .14); }
    .alert-warn { border-color: rgba(255, 215, 0, .45); }
    .alert-warn .alert-icon { color: var(--gold); background: rgba(255, 215, 0, .14); }
    .alert-info { border-color: rgba(77, 163, 255, .42); }
    .alert-info .alert-icon { color: var(--blue); background: rgba(77, 163, 255, .14); }
    .alert-good { border-color: rgba(0, 200, 150, .42); }
    .alert-good .alert-icon { color: var(--green); background: rgba(0, 200, 150, .14); }

    .toolbar { display: grid; gap: 10px; margin: 0 0 14px; }
    .tabs, .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .tab, .chip { white-space: nowrap; padding: 0 14px; border: 1px solid var(--line); }
    .tab.active, .chip.active { background: var(--gold); color: #101521; font-weight: 800; }
    .game-list { display: grid; gap: 12px; }
    .game-card {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .game-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; color: var(--muted); font-size: .85rem; }
    .match { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .team { min-width: 0; font-weight: 800; font-size: 1.02rem; }
    .team.away { text-align: right; }
    .team-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
    }
    .team.away .team-label { justify-content: flex-end; }
    .flag {
      flex: 0 0 auto;
      font-size: 1.22em;
      line-height: 1;
    }
    .versus { color: var(--gold); font-weight: 900; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .78rem;
    }
    .pill.good { color: var(--green); border-color: rgba(0,200,150,.45); }
    .pill.warn { color: var(--gold); border-color: rgba(255,215,0,.45); }
    .pill.bad { color: var(--red); border-color: rgba(255,92,122,.45); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button { padding: 0 12px; }

    .score-editor {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin: 14px 0;
    }
    .score-box { display: grid; gap: 8px; justify-items: center; }
    .score-controls { display: grid; grid-template-columns: 44px 64px 44px; gap: 7px; }
    .score-controls input { padding: 0; font-size: 1.2rem; font-weight: 900; }
    .mini { font-size: .84rem; color: var(--muted); }
    .form-row { display: grid; gap: 10px; margin: 10px 0; }
    .rule-score-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 10px 0 16px;
    }
    .rule-editor-list { display: grid; gap: 10px; }
    .rule-editor-item {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
    }
    .admin-grid { display: grid; gap: 14px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-size: .82rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .medal { font-size: 1.35rem; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      z-index: 30;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 16px;
      border-radius: 8px;
      color: #07131B;
      font-weight: 900;
      background: var(--green);
      transition: opacity .2s ease, transform .2s ease;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 12;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      padding: 8px;
      border-top: 1px solid var(--line);
      background: rgba(10, 14, 26, .94);
      backdrop-filter: blur(16px);
    }
    body.light .bottom-nav { background: rgba(245, 247, 251, .94); }
    .nav-btn {
      display: grid;
      place-items: center;
      min-height: 54px;
      padding: 4px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: .72rem;
      gap: 2px;
    }
    .nav-btn b { font-size: 1.05rem; line-height: 1; }
    .nav-btn.active { color: var(--gold); }
    .hidden { display: none !important; }

    @media (min-width: 760px) {
      .login-grid { grid-template-columns: 1fr 280px; align-items: start; }
      .front-info { grid-template-columns: 1.15fr .85fr; }
      .install-actions { grid-template-columns: auto 1fr; align-items: center; }
      .identity-actions { grid-template-columns: 1fr auto; }
      .grid.two { grid-template-columns: 1.2fr .8fr; }
      .grid.three { grid-template-columns: repeat(3, 1fr); }
      .toolbar { grid-template-columns: 1fr 300px; align-items: center; }
      .form-row { grid-template-columns: 1fr 1fr; align-items: end; }
      .rule-score-grid { grid-template-columns: 1fr 1fr; }
      .admin-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 980px) {
      .app { grid-template-rows: auto 1fr; }
      .layout { grid-template-columns: 220px 1fr; }
      .sidebar {
        position: sticky;
        top: 67px;
        display: grid;
        align-content: start;
        gap: 8px;
        height: calc(100vh - 67px);
        padding: 16px;
        border-right: 1px solid var(--line);
      }
      .sidebar .nav-btn {
        grid-template-columns: 26px 1fr;
        justify-items: start;
        text-align: left;
        padding: 0 12px;
        border-radius: 8px;
        font-size: .95rem;
      }
      .sidebar .nav-btn.active { background: var(--panel); }
      .bottom-nav { display: none; }
      main { padding-bottom: 32px; }
    }
  </style>
</head>

    function hydrateGames(savedGames, baseGames) {
      if (!Array.isArray(savedGames) || !savedGames.length) return baseGames;
      const baseById = new Map((baseGames || []).map(game => [game.id, game]));
      return savedGames.map(game => {
        const base = baseById.get(game.id);
        const groupGame = base?.type === "group" || game.type === "group";
        const refreshTeam = teamKey => {
          if (!base) return game[teamKey];
          if (groupGame) return base[teamKey];
          if (game.result || game.type !== "knockout") return game[teamKey];

          const currentTeam = game[teamKey];
          const baseTeam = base[teamKey];
          if (!currentTeam) return baseTeam;
          if (isPlaceholderTeam(currentTeam)) return baseTeam;
          if (!isPlaceholderTeam(baseTeam) && currentTeam !== baseTeam) return baseTeam;
          return currentTeam;
        };
        return {
          ...game,
          datetime: base?.datetime || game.datetime,
          homeTeam: refreshTeam("homeTeam"),
          awayTeam: refreshTeam("awayTeam"),
          sourceHomeTeam: base?.sourceHomeTeam || base?.homeTeam || game.sourceHomeTeam || game.homeTeam,

    function passwordCreatedTime(entry) {
      const value = entry?.createdAt || entry?.updatedAt || "";
      const time = Date.parse(value);
      return Number.isFinite(time) ? time : (entry?.hash ? 1 : 0);
    }

    function passwordResetTime(data, name) {
      const value = data?.participantPasswordResets?.[name] || "";
      const time = Date.parse(value);
      return Number.isFinite(time) ? time : 0;
    }

    function cleanPasswordState(data) {
      data.participantPasswords ||= {};
      data.participantPasswordResets ||= {};
      Object.entries(data.participantPasswords).forEach(([name, entry]) => {
        if (!entry?.hash || passwordResetTime(data, name) > passwordCreatedTime(entry)) {
          delete data.participantPasswords[name];
        }
      });
      return data;
    }

    function predictionSubmittedTime(pred) {
      const value = pred?.submittedAt || pred?.updatedAt || "";
      const time = Date.parse(value);
      return Number.isFinite(time) ? time : (pred ? 1 : 0);
    }

    function predictionResetTime(data, name) {
      const value = data?.predictionResets?.[name] || "";
      const time = Date.parse(value);
      return Number.isFinite(time) ? time : 0;
    }

    function predictionIsActive(data, name, pred) {
      return !!pred && predictionResetTime(data, name) <= predictionSubmittedTime(pred);
    }

    function archivePrediction(data, name, gameId, pred) {
      if (!predictionIsActive(data, name, pred)) return;
      data.predictionArchive ||= {};
      data.predictionArchive[name] ||= {};
      const archived = data.predictionArchive[name][gameId];
      if (!archived || predictionSubmittedTime(pred) >= predictionSubmittedTime(archived)) {
        data.predictionArchive[name][gameId] = { ...pred };
      }
    }

    function rememberPrediction(data, name, gameId, pred) {
      data.predictions ||= {};
      data.predictions[name] ||= {};
      data.predictions[name][gameId] = { ...pred };
      archivePrediction(data, name, gameId, pred);
    }

    function cleanPredictionState(data) {
      data.predictions ||= {};
      data.predictionArchive ||= {};
      data.predictionResets ||= {};
      Object.entries(data.predictions).forEach(([name, entries]) => {
        Object.entries(entries || {}).forEach(([gameId, pred]) => archivePrediction(data, name, gameId, pred));
      });
      Object.entries(data.predictionArchive).forEach(([name, entries]) => {
        Object.entries(entries || {}).forEach(([gameId, pred]) => {
          if (!predictionIsActive(data, name, pred)) return;
          data.predictions[name] ||= {};
          const current = data.predictions[name][gameId];
          if (!current || predictionSubmittedTime(pred) > predictionSubmittedTime(current)) {
            data.predictions[name][gameId] = { ...pred };
          }
        });
      });
      Object.entries(data.predictions).forEach(([name, entries]) => {
        Object.entries(entries || {}).forEach(([gameId, pred]) => {
          if (!predictionIsActive(data, name, pred)) {
            delete data.predictions[name][gameId];
          }
        });
        if (!Object.keys(data.predictions[name] || {}).length) delete data.predictions[name];
      });
      return data;
    }

    function recoverParticipantNames(data, fallback = []) {
      const names = [];
      const seen = new Set();
      const add = name => {
        const clean = String(name || "").trim().replace(/\s+/g, " ");
        const key = clean.toLowerCase();
        if (!clean || seen.has(key)) return;
        seen.add(key);
        names.push(clean);
      };

      (Array.isArray(data.participants) ? data.participants : fallback).forEach(add);
      [data.predictions || {}, data.predictionArchive || {}].forEach(source => {
        Object.entries(source).forEach(([name, entries]) => {
          const hasActivePrediction = Object.values(entries || {}).some(pred => predictionIsActive(data, name, pred));
          if (hasActivePrediction) add(name);
        });
      });
      return names;
    }

    function versionBefore(value, target) {
      const a = String(value || "0").split(".").map(part => Number(part) || 0);
      const b = String(target || "0").split(".").map(part => Number(part) || 0);
      const length = Math.max(a.length, b.length);
      for (let i = 0; i < length; i++) {
        const left = a[i] || 0;
        const right = b[i] || 0;
        if (left !== right) return left < right;
      }
      return false;
    }

    function swapScoreSides(entry) {
      if (!entry || typeof entry !== "object") return;
      if (!Object.prototype.hasOwnProperty.call(entry, "home") && !Object.prototype.hasOwnProperty.call(entry, "away")) return;
      const home = entry.home;
      entry.home = entry.away;
      entry.away = home;
    }

    function migrateGeScheduleOrientation(data, force = false) {
      if (!data || typeof data !== "object") return data;
      data.meta ||= {};
      if (data.meta[GE_SCHEDULE_MIGRATION_KEY]) return data;
      if (!force && !versionBefore(data.meta.version, GE_SCHEDULE_MIGRATION_VERSION)) return data;

      const swappedGames = new Set(GE_SCHEDULE_SWAPPED_GAMES);
      Object.values(data.predictions || {}).forEach(entries => {
        swappedGames.forEach(gameId => swapScoreSides(entries?.[gameId]));
      });
      Object.values(data.predictionArchive || {}).forEach(entries => {
        swappedGames.forEach(gameId => swapScoreSides(entries?.[gameId]));
      });
      (data.games || []).forEach(game => {
        if (!swappedGames.has(game.id)) return;
        swapScoreSides(game.result);
      });
      data.meta[GE_SCHEDULE_MIGRATION_KEY] = true;
      return data;
    }

    function normalizeStoredData(savedData = {}) {

    function mergeSharedProtection(localData, remoteData) {
      const local = normalizeStoredData(localData);
      if (!remoteData) return local;
      const remote = normalizeStoredData(remoteData);
      Object.entries(remote.predictionResets || {}).forEach(([name, resetAt]) => {
        if (predictionResetTime(remote, name) > predictionResetTime(local, name)) {
          local.predictionResets[name] = resetAt;
        }
      });
      Object.entries(remote.predictions || {}).forEach(([name, entries]) => {
        Object.entries(entries || {}).forEach(([gameId, remotePred]) => {
          if (!remotePred) return;
          if (predictionResetTime(local, name) > predictionSubmittedTime(remotePred)) return;
          local.predictions[name] ||= {};
          const localPred = local.predictions[name][gameId];
          if (!localPred || predictionSubmittedTime(remotePred) > predictionSubmittedTime(localPred)) {
            local.predictions[name][gameId] = remotePred;
          }
        });
      });
      Object.entries(remote.participantPasswordResets || {}).forEach(([name, resetAt]) => {
        if (passwordResetTime(remote, name) > passwordResetTime(local, name)) {
          local.participantPasswordResets[name] = resetAt;
        }
      });
      Object.entries(remote.participantPasswords || {}).forEach(([name, remoteEntry]) => {
        if (!remoteEntry?.hash) return;
        if (passwordResetTime(local, name) > passwordCreatedTime(remoteEntry)) return;
        local.participantPasswords[name] = remoteEntry;
      });
      return cleanPredictionState(cleanPasswordState(local));

    function loadLocalPredictionBackup() {

    function mergePredictionArchive(target, source) {
      target.predictionArchive ||= {};
      Object.entries(source?.predictionArchive || {}).forEach(([name, entries]) => {
        Object.entries(entries || {}).forEach(([gameId, pred]) => archivePrediction(target, name, gameId, pred));
      });
      Object.entries(source?.predictions || {}).forEach(([name, entries]) => {
        Object.entries(entries || {}).forEach(([gameId, pred]) => archivePrediction(target, name, gameId, pred));
      });
      Object.entries(source?.predictionResets || {}).forEach(([name, resetAt]) => {
        if (Date.parse(resetAt) > predictionResetTime(target, name)) {
          target.predictionResets ||= {};
          target.predictionResets[name] = resetAt;
        }
      });
      return cleanPredictionState(target);
    }

    function applyLocalPredictionBackup(data) {
      const backup = loadLocalPredictionBackup();
      if (!backup.predictionArchive && !backup.predictions) return data;
      return mergePredictionArchive(data, backup);

    function saveLocalPredictionBackup(data) {
      try {
        const backup = applyLocalPredictionBackup({
          predictions: {},
          predictionArchive: {},
          predictionResets: {}

        mergePredictionArchive(backup, data);
        backup.updatedAt = new Date().toISOString();
        localStorage.setItem(PREDICTION_BACKUP_KEY, JSON.stringify({
          meta: backup.meta || {},
          predictionArchive: backup.predictionArchive || {},
          predictionResets: backup.predictionResets || {},
          updatedAt: backup.updatedAt

    }

        state.backend.status = "local";
        state.backend.error = "";
        state.backend.lastSync = "";
        renderBackendOnly();
        return;
      }

      state.backend.status = "syncing";
      state.backend.error = "";
      renderBackendOnly();
      await pullBackendData({ pushIfMissing: true });
      state.backend.pollTimer = setInterval(() => pullBackendData(), 30000);
    }

    function scheduleBackendSave(options = {}) {
      if (!state.backend || !backendIsConfigured()) return;
      clearTimeout(state.backend.saveTimer);
      state.backend.saveOptions = { ...(state.backend.saveOptions || {}), ...options };
      state.backend.status = "saving";
      renderBackendOnly();
      state.backend.saveTimer = setTimeout(() => {
        const saveOptions = state.backend.saveOptions || {};
        state.backend.saveOptions = null;
        pushBackendData(saveOptions);
      }, 800);
    }

    async function fetchBackendData() {
      const cfg = state.backend.config;
      const url = `${backendBaseUrl()}?id=eq.${encodeURIComponent(cfg.rowId)}&select=id,data,updated_at`;
      const response = await fetchWithTimeout(url, {
        headers: backendHeaders({ Accept: "application/json" }),
        cache: "no-store"
      });
      if (!response.ok) throw new Error(`Supabase ${response.status}`);
      const rows = await response.json();
      return rows[0]?.data || null;
    }

    async function pullBackendData(options = {}) {
      if (!backendIsConfigured()) return;
      try {
        const remoteData = await fetchBackendData();

        if (!remoteData) {
          if (options.pushIfMissing) await pushBackendData();
          else {
            state.backend.status = "online";
            state.backend.lastSync = new Date().toISOString();
          }
          renderBackendOnly();
          return;
        }

        const normalizedRemote = normalizeStoredData(remoteData);
        if (participantsDiffer(state.data, normalizedRemote)) {
          const localCustom = hasCustomParticipants(state.data);
          const remoteCustom = hasCustomParticipants(normalizedRemote);
          if (!localCustom && remoteCustom) {
            state.data = mergeSharedProtection(normalizedRemote, state.data);
            persistStateData();
            state.backend.status = "online";
            state.backend.lastSync = new Date().toISOString();
            render();
            return;
          }
          if (localCustom && remoteCustom) {
            if (state.session?.role !== "admin") {
              const remoteProtectedBefore = protectedStateSignature(normalizedRemote);
              state.data = mergeSharedProtection(normalizedRemote, state.data);
              persistStateData();
              state.backend.status = "online";
              state.backend.lastSync = new Date().toISOString();
              render();
              if (protectedStateSignature(state.data) !== remoteProtectedBefore) await pushBackendData({ preserveRemoteParticipants: true });
              return;
            }
            state.backend.status = "conflict";
            state.backend.error = "Os participantes deste navegador diferem do banco. Revise no Admin antes de sincronizar.";
            renderBackendOnly();
            return;
          }
        }

        const remoteProtectedBefore = protectedStateSignature(normalizedRemote);
        const mergedFromRemote = mergeSharedProtection(normalizedRemote, state.data);
        const shouldUseRemoteBase = state.session?.role !== "admin" &&
          sharedStateSignature(mergedFromRemote) !== sharedStateSignature(state.data);

        if (shouldUseRemoteBase || dataTimestamp(normalizedRemote) > dataTimestamp(state.data)) {
          const shouldPushProtected = protectedStateSignature(mergedFromRemote) !== remoteProtectedBefore;
          state.data = mergedFromRemote;
          persistStateData();
          state.backend.status = "online";
          state.backend.lastSync = new Date().toISOString();
          render();
          if (shouldPushProtected) await pushBackendData({ preserveRemoteParticipants: true });
          return;
        }

        const beforeProtected = protectedStateSignature(state.data);
        const protectedData = mergeSharedProtection(state.data, normalizedRemote);
        if (protectedStateSignature(protectedData) !== beforeProtected) {
          state.data = protectedData;
          persistStateData();
          if (state.view === "login") renderLogin();
        }

        if (options.pushIfMissing && dataTimestamp(state.data) > dataTimestamp(normalizedRemote)) {
          await pushBackendData({ preserveRemoteParticipants: state.session?.role !== "admin" });
          return;
        }

        state.backend.status = "online";
        state.backend.lastSync = new Date().toISOString();
        renderBackendOnly();
      } catch (error) {
        state.backend.status = "offline";
        state.backend.error = error.message || "erro de sincronizacao";
        if (state.session) toast("Aviso: sincronizacao falhou");
        renderBackendOnly();
      }
    }

    async function pushBackendData(options = {}) {
      if (!backendIsConfigured()) return;
      try {
        const cfg = state.backend.config;
        const remoteData = await fetchBackendData();
        const normalizedRemote = remoteData ? normalizeStoredData(remoteData) : null;
        if (normalizedRemote && participantsDiffer(state.data, normalizedRemote)) {
          const localCustom = hasCustomParticipants(state.data);
          const remoteCustom = hasCustomParticipants(normalizedRemote);
          if (!localCustom && remoteCustom) {
            state.data = mergeSharedProtection(normalizedRemote, state.data);
            persistStateData();
            state.backend.status = "online";
            state.backend.error = "Protegido: dados padrao deste navegador nao sobrescreveram participantes do banco.";
            state.backend.lastSync = new Date().toISOString();
            renderBackendOnly();
            return;
          }
          if (localCustom && remoteCustom) {
            if (options.preserveRemoteParticipants || state.session?.role !== "admin") {
              state.data = mergeSharedProtection(normalizedRemote, state.data);
              persistStateData();
            } else if (!options.allowParticipantOverwrite) {
              state.backend.status = "conflict";
              state.backend.error = "Os participantes deste navegador diferem do banco. Envio bloqueado para nao sobrescrever dados.";
              renderBackendOnly();
              return;
            }
          }
        }
        state.data = normalizedRemote && (options.preserveRemoteParticipants || state.session?.role !== "admin")
          ? mergeSharedProtection(normalizedRemote, state.data)
          : mergeSharedProtection(state.data, normalizedRemote);
        touchData();
        persistStateData();
        const response = await fetchWithTimeout(`${backendBaseUrl()}?on_conflict=id`, {
          method: "POST",
          headers: backendHeaders({ Prefer: "resolution=merge-duplicates,return=minimal" }),
          body: JSON.stringify({ id: cfg.rowId, data: state.data }),
          cache: "no-store"
        }, 15000);
        if (!response.ok) throw new Error(`Supabase ${response.status}`);
        state.backend.status = "online";
        state.backend.error = "";
        state.backend.lastSync = new Date().toISOString();
        renderBackendOnly();
      } catch (error) {
        state.backend.status = "offline";
        state.backend.error = error.message || "erro ao salvar";
        if (state.session) toast("Salvo localmente, mas backend falhou");
        renderBackendOnly();
      }
    }

    function shouldCheckResults() {
      const now = Date.now();
      const lateResults = state.data.games.some(game =>
        !game.result && new Date(game.datetime).getTime() + 2 * 3600000 < now
      );
      const pendingKnockoutNames = state.data.games.some(game => {
        if (game.type !== "knockout" || game.result) return false;
        if (!isPlaceholderTeam(game.homeTeam) && !isPlaceholderTeam(game.awayTeam)) return false;
        return new Date(game.datetime).getTime() - 21 * 24 * 3600000 < now;
      });
      return lateResults || pendingKnockoutNames;
    }

    function finalResultStatus(status) {
      return ["FT", "AET", "PEN"].includes(status);
    }

    function findLocalGameForApiMatch(match) {
      if (match.localId) {
        const byId = state.data.games.find(game => game.id === match.localId);
        if (byId) return byId;
      }
      const key = teamPairKey(match.homeTeam, match.awayTeam);
      const candidates = state.data.games.filter(game => teamPairKey(game.homeTeam, game.awayTeam) === key);
      if (!candidates.length) return null;
      if (candidates.length === 1) return candidates[0];
      const matchTime = match.date ? new Date(match.date).getTime() : 0;
      return candidates
        .map(game => ({ game, diff: Math.abs(new Date(game.datetime).getTime() - matchTime) }))
        .sort((a,b) => a.diff - b.diff)[0].game;
    }

    function applyApiTeamNames(matches) {
      const updates = [];
      (matches || []).filter(match => match.localId).forEach(match => {
        const game = state.data.games.find(item => item.id === match.localId);
        if (!game || game.result) return;
        [
          ["homeTeam", match.homeTeam],
          ["awayTeam", match.awayTeam]
        ].forEach(([teamKey, nextTeam]) => {
          if (!nextTeam || isPlaceholderTeam(nextTeam) || game[teamKey] === nextTeam) return;
          updates.push(`${game.id}: ${teamText(game[teamKey])} -> ${teamText(nextTeam)}`);
          game[teamKey] = nextTeam;
        });
      });
      return updates;
    }

    function apiResultsForAdminReview(matches) {
      const pending = [];
      const conflicts = [];

      matches.filter(match => finalResultStatus(match.statusShort)).forEach(match => {
        if (!Number.isInteger(match.home) || !Number.isInteger(match.away)) return;
        const game = findLocalGameForApiMatch(match);
        if (!game) return;

        const nextResult = { home: match.home, away: match.away };
        const existing = game.result;
        const differs = existing && (existing.home !== nextResult.home || existing.away !== nextResult.away);
        if (differs) {
          conflicts.push(`${game.id}: local ${existing.home}x${existing.away}, API ${nextResult.home}x${nextResult.away}`);
          return;
        }

        if (!existing) {
          pending.push({
            id: game.id,
            homeTeam: game.homeTeam,
            awayTeam: game.awayTeam,
            home: nextResult.home,
            away: nextResult.away,
            winner: match.winner || null,
            wentOvertime: !!match.wentOvertime
          });
        }
      });

      return { pending, conflicts };
    }

    async function updateResultsFromApi(options = {}) {
      if (!options.silent) {
        const ok = confirm("Conferir resultados da API? Nada sera gravado automaticamente; depois preencha e confirme no Resultado real.");
        if (!ok) return;
      }

      state.results.status = "checking";
      state.results.error = "";
      renderAdminOnly();

      try {
        const response = await fetchWithTimeout("api/results", { cache: "no-store" });
        const payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.message || payload.error || `API ${response.status}`);
        }

        const { pending, conflicts } = apiResultsForAdminReview(payload.matches || []);
        state.results.status = "online";
        state.results.lastCheck = payload.checkedAt || new Date().toISOString();
        state.results.lastApplied = 0;
        state.results.pendingReview = pending;
        const noMatches = !Array.isArray(payload.matches) || payload.matches.length === 0;
        state.results.error = conflicts.length
          ? `Conflitos: ${conflicts.slice(0, 2).join("; ")}`
          : (pending.length ? `${pending.length} resultado(s) para conferir no Admin.` : (noMatches ? "API respondeu, mas nao retornou jogos para a Copa 2026 ainda." : ""));

        if (!options.silent) toast(pending.length ? `${pending.length} resultado(s) para conferir` : (conflicts.length ? "Ha conflitos para revisar" : (noMatches ? "API sem jogos retornados" : "Nenhum resultado novo")));
        render();
      } catch (error) {
        state.results.status = "offline";
        state.results.error = error.message || "erro ao buscar resultados";
        if (!options.silent) toast("Resultados automaticos indisponiveis");
        renderAdminOnly();
      }
    }

    function sign(x) { return x > 0 ? 1 : x < 0 ? -1 : 0; }
    function gameDeadline(game) { return new Date(game.datetime).getTime() - 60 * 60 * 1000; }
    function isLocked(game) { return Date.now() >= gameDeadline(game); }
    function getPred(user, gameId) { return state.data.predictions[user]?.[gameId] || null; }
    function hasStoppageScore(value) {
      return value && Number.isInteger(value.home) && Number.isInteger(value.away);
    }
    function stoppageSuffix(value) {
      return hasStoppageScore(value) ? `, prorrogacao ${value.home} x ${value.away}` : "";
    }
    function stoppageInputValue(value, side) {
      return hasStoppageScore(value) ? value[side] : "";
    }
    function readOptionalStoppage(homeId, awayId, finalHome, finalAway) {
      const homeRaw = (document.getElementById(homeId)?.value || "").trim();
      const awayRaw = (document.getElementById(awayId)?.value || "").trim();
      if (homeRaw === "" && awayRaw === "") return { stoppage: null };
      if (homeRaw === "" || awayRaw === "") return { error: "Preencha os dois gols da prorrogacao ou deixe os dois em branco" };
      const home = Number(homeRaw);
      const away = Number(awayRaw);
      if (!Number.isInteger(home) || !Number.isInteger(away) || home < 0 || away < 0) {
        return { error: "Gols da prorrogacao precisam ser inteiros e maiores ou iguais a zero" };
      }
      if (home > finalHome || away > finalAway) {
        return { error: "Gols da prorrogacao nao podem ser maiores que o placar final" };
      }
      return { stoppage: { home, away } };
    }
    function predictedAdvancedTeam(game, pred) {
      if (!game || game.type !== "knockout" || !pred) return null;
      if (pred.home > pred.away) return game.homeTeam;
      if (pred.away > pred.home) return game.awayTeam;
      return pred.advancedTeam || null;
    }
    function gameWinner(game) {
      if (!game?.result) return null;
      if (game.type === "knockout" && game.advancedTeam) return game.advancedTeam;
      if (game.result.home > game.result.away) return game.homeTeam;
      if (game.result.away > game.result.home) return game.awayTeam;
      return null;
    }
    function gameLoser(game) {
      const winner = gameWinner(game);
      if (!winner) return null;
      return winner === game.homeTeam ? game.awayTeam : game.homeTeam;
    }
    function groupQualifiedTeams(data = state.data) {
      const result = {};
      const groups = {};
      (data.games || []).filter(game => game.type === "group").forEach(game => {
        groups[game.group] ||= [];
        groups[game.group].push(game);
      });
      Object.entries(groups).forEach(([group, games]) => {
        if (games.length < 6 || games.some(game => !game.result)) return;
        const table = {};
        const rowFor = team => table[team] ||= { team, pts: 0, wins: 0, gf: 0, ga: 0, gd: 0 };
        games.forEach(game => {
          const home = rowFor(game.homeTeam);
          const away = rowFor(game.awayTeam);
          home.gf += game.result.home;
          home.ga += game.result.away;
          away.gf += game.result.away;
          away.ga += game.result.home;
          home.gd = home.gf - home.ga;
          away.gd = away.gf - away.ga;
          if (game.result.home > game.result.away) {
            home.pts += 3;
            home.wins += 1;
          } else if (game.result.away > game.result.home) {
            away.pts += 3;
            away.wins += 1;
          } else {
            home.pts += 1;
            away.pts += 1;
          }
        });
        const sorted = Object.values(table).sort((a,b) =>
          b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || b.wins - a.wins || a.team.localeCompare(b.team)
        );
        if (sorted[0]) result[`1o Grupo ${group}`] = sorted[0].team;
        if (sorted[1]) result[`2o Grupo ${group}`] = sorted[1].team;
      });
      return result;
    }
    function isDynamicTeamSource(source) {
      return /^(Vencedor|Perdedor)\s+/.test(source || "") || /^[12]o Grupo [A-L]$/.test(source || "") || /^3o [A-L/]+$/.test(source || "");
    }
    function resolveTeamSource(source, gameById, groupRanks) {
      const text = String(source || "").trim();
      let match = text.match(/^Vencedor\s+(.+)$/);
      if (match) return gameWinner(gameById.get(match[1]));
      match = text.match(/^Perdedor\s+(.+)$/);
      if (match) return gameLoser(gameById.get(match[1]));
      return groupRanks[text] || null;
    }
    function updateDerivedTeamsFromResults(data = state.data) {
      const games = data.games || [];
      const gameById = new Map(games.map(game => [game.id, game]));
      const groupRanks = groupQualifiedTeams(data);
      let changes = 0;
      games.forEach(game => {
        if (game.type !== "knockout" || game.result) return;
        [["homeTeam", "sourceHomeTeam"], ["awayTeam", "sourceAwayTeam"]].forEach(([teamKey, sourceKey]) => {
          game[sourceKey] ||= game[teamKey];
          const source = game[sourceKey];
          const resolved = resolveTeamSource(source, gameById, groupRanks);
          const nextTeam = resolved || (isDynamicTeamSource(source) ? source : game[teamKey]);
          if (nextTeam && game[teamKey] !== nextTeam && (!isPlaceholderTeam(nextTeam) || isPlaceholderTeam(game[teamKey]))) {
            game[teamKey] = nextTeam;
            changes += 1;
          }
        });
      });
      return changes;
    }

    function collectUserAlerts(user) {
      const alerts = [];
      const games = state.data.games;
      const now = Date.now();
      const openMissing = games.filter(g => !getPred(user, g.id) && !isLocked(g));
      const closingSoon = openMissing
        .filter(g => gameDeadline(g) - now > 0 && gameDeadline(g) - now <= 2 * 3600000)
        .sort((a,b) => gameDeadline(a) - gameDeadline(b));
      const closingToday = openMissing
        .filter(g => gameDeadline(g) - now > 2 * 3600000 && gameDeadline(g) - now <= 24 * 3600000)
        .sort((a,b) => gameDeadline(a) - gameDeadline(b));
      const missed = games.filter(g => !getPred(user, g.id) && isLocked(g) && !g.result);

      if (state.backend.status === "conflict") alerts.push(alertItem("error", "Dados locais diferentes do banco", state.backend.error || "Revise no Admin antes de sincronizar."));
      else if (state.backend.status === "offline") alerts.push(alertItem("error", "Sincronizacao falhou", state.backend.error || "Sem conexao com o banco. Seus dados ficam locais ate voltar."));
      else if (!backendIsConfigured()) alerts.push(alertItem("warn", "Modo local", "Os dados deste navegador nao aparecem para os outros participantes."));
      else if (state.backend.status === "saving" || state.backend.status === "syncing") alerts.push(alertItem("info", "Sincronizando", "Aguarde alguns segundos antes de fechar o app."));

      if (closingSoon.length) {
        const g = closingSoon[0];
        alerts.push(alertItem("error", "Palpite quase fechando", `${teamText(g.homeTeam)} x ${teamText(g.awayTeam)} fecha em ${timeLeft(gameDeadline(g) - now)}.`));
      }
      if (closingToday.length) {
        const g = closingToday[0];
        alerts.push(alertItem("warn", "Palpite pendente hoje", `${teamText(g.homeTeam)} x ${teamText(g.awayTeam)} fecha em ${timeLeft(gameDeadline(g) - now)}.`));
      }
      if (openMissing.length) alerts.push(alertItem("info", "Palpites pendentes", `Voce ainda tem ${openMissing.length} jogo(s) abertos sem palpite.`));
      if (missed.length) alerts.push(alertItem("warn", "Prazo perdido", `${missed.length} jogo(s) passaram do prazo sem palpite.`));
      if (!alerts.length) alerts.push(alertItem("good", "Tudo certo", "Nenhum aviso importante agora."));
      return alerts.slice(0, 5);
    }

    function collectAdminAlerts() {
      const alerts = [];
      const now = Date.now();
      const participants = state.data.participants;
      const duplicates = participants.filter((name, index) => participants.indexOf(name) !== index);
      const pastNoResult = state.data.games
        .filter(g => new Date(g.datetime).getTime() + 2 * 3600000 < now && !g.result)
        .sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
      const placeholderSoon = state.data.games
        .filter(g => g.type === "knockout" && !g.result && (isPlaceholderTeam(g.homeTeam) || isPlaceholderTeam(g.awayTeam)))
        .filter(g => new Date(g.datetime).getTime() - now <= 7 * 24 * 3600000)
        .sort((a,b) => new Date(a.datetime) - new Date(b.datetime));

      if (state.backend.status === "conflict") alerts.push(alertItem("error", "Conflito de sincronizacao", state.backend.error || "Os dados locais diferem do banco."));
      else if (state.backend.status === "offline") alerts.push(alertItem("error", "Backend offline", state.backend.error || "Nao foi possivel sincronizar com o Supabase."));
      else if (!backendIsConfigured()) alerts.push(alertItem("error", "Backend nao configurado", "Configure Supabase para todos verem o mesmo ranking."));
      else if (state.backend.status === "saving" || state.backend.status === "syncing") alerts.push(alertItem("info", "Sincronizando dados", "Aguarde a confirmacao antes de fechar o app."));
      if (state.results.status === "offline") alerts.push(alertItem("warn", "Resultados automaticos indisponiveis", state.results.error || "Configure APISPORTS_KEY na Vercel."));
      if (state.results.status === "checking") alerts.push(alertItem("info", "Buscando resultados", "A API de placares esta sendo consultada agora."));

      if (participants.length < 5) alerts.push(alertItem("warn", "Poucos participantes", `O bolao recomenda 5 a 15 pessoas. Agora tem ${participants.length}.`));
      if (participants.length > 15) alerts.push(alertItem("error", "Participantes demais", "Remova nomes ate ficar no maximo com 15."));
      if (duplicates.length) alerts.push(alertItem("error", "Nome duplicado", `Revise: ${duplicates.join(", ")}.`));
      if (state.data.adminPassword === DEFAULT_PASSWORD) alerts.push(alertItem("warn", "Senha padrao", "Troque a senha do admin se o link for compartilhado."));
      if (pastNoResult.length) {

        alerts.push(alertItem("info", "Mata-mata incompleto", `Atualize os times de ${g.id}: ${teamText(g.homeTeam)} x ${teamText(g.awayTeam)}.`));
      }
      if (!alerts.length) alerts.push(alertItem("good", "Tudo certo", "Nenhum aviso administrativo importante agora."));
      return alerts.slice(0, 6);

    function scorePrediction(game, pred) {
      if (!game.result || !pred) return { points: 0, exact: 0, correct: 0 };
      const real = game.result;
      const realSign = sign(real.home - real.away);
      const predSign = sign(pred.home - pred.away);
      const exact = real.home === pred.home && real.away === pred.away;
      const totalOk = real.home + real.away === pred.home + pred.away;
      const score = scoringRules();
      let points = 0;
      let correct = 0;

      if (game.type === "group") {
        if (exact) points = Number(score.groupExact) || 0;
        else if (realSign === predSign && totalOk) points = Number(score.groupResultTotal) || 0;
        else if (realSign === predSign) points = Number(score.groupResult) || 0;
        if (realSign === predSign) correct = 1;
      } else {
        const predAdvanced = predictedAdvancedTeam(game, pred);
        const advancedOk = predAdvanced && game.advancedTeam && predAdvanced === game.advancedTeam;
        if (exact) points = Number(score.knockoutExact) || 0;
        else if (realSign === predSign && totalOk) points = Number(score.knockoutResultTotal) || 0;
        else if (realSign !== 0 && realSign === predSign) points = Number(score.knockoutResult) || 0;
        else if (realSign === 0 && predSign === 0 && advancedOk) points = Number(score.knockoutDrawAdvanced) || 0;
        else if (advancedOk) points = Number(score.knockoutAdvanced) || 0;
        if (realSign === predSign || advancedOk) correct = 1;
        if (pred.overtime === true && game.wentOvertime === true) points += Number(score.overtimeBonus) || 0;
      }
      if (
        hasStoppageScore(real.stoppage) &&
        hasStoppageScore(pred.stoppage) &&
        real.stoppage.home === pred.stoppage.home &&
        real.stoppage.away === pred.stoppage.away
      ) {
        points += Number(score.stoppageExactBonus) || 0;
      }
      return { points, exact: exact ? 1 : 0, correct };
    }

    function scores(data = state.data) {
      return data.participants.map(name => {
        const row = { name, total: 0, exact: 0, correct: 0, made: 0 };
        data.games.forEach(game => {
          const pred = data.predictions?.[name]?.[game.id] || null;
          if (pred) row.made += 1;
          const s = scorePrediction(game, pred);
          row.total += s.points;
          row.exact += s.exact;
          row.correct += s.correct;
        });
        return row;
      }).sort((a,b) => b.total - a.total || b.exact - a.exact || b.correct - a.correct || a.name.localeCompare(b.name));
    }

    async function hashParticipantPassword(name, password) {
      const text = `${normalizeTeamName(name)}::${password}`;
      if (window.crypto?.subtle) {
        const bytes = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, "0")).join("");
      }
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return `fallback-${Math.abs(hash)}`;
    }

    async function refreshParticipantPasswordFromBackend(name) {
      if (!backendIsConfigured()) return false;
      try {
        const before = protectedStateSignature(state.data);
        const remoteData = await fetchBackendData();
        if (!remoteData) {
          state.backend.status = "online";
          state.backend.error = "";
          state.backend.lastSync = new Date().toISOString();
          return false;
        }
        state.data = mergeSharedProtection(state.data, remoteData);
        persistStateData();
        state.backend.status = "online";
        state.backend.error = "";
        state.backend.lastSync = new Date().toISOString();
        return before !== protectedStateSignature(state.data);
      } catch (error) {
        state.backend.status = "offline";
        state.backend.error = error.message || "erro ao verificar senha";
        return false;
      }
    }

    async function confirmParticipantLogin() {
      const select = document.getElementById("participantSelect");
      const name = select?.value;
      if (!name || !state.data.participants.includes(name)) return toast("Escolha um participante valido");
      const hadPasswordBeforeSync = hasParticipantPassword(name);
      const passwordStateChanged = await refreshParticipantPasswordFromBackend(name);
      const hasPasswordAfterSync = hasParticipantPassword(name);
      if (!hadPasswordBeforeSync && !hasPasswordAfterSync && backendIsConfigured() && state.backend.status === "offline") {
        return toast("Nao consegui verificar o banco. Tente de novo antes de criar senha.");
      }
      if (passwordStateChanged && hadPasswordBeforeSync !== hasPasswordAfterSync) {
        localStorage.setItem("bolaoLastParticipant", name);
        renderLogin();
        toast(hasPasswordAfterSync ? "Este participante ja tem senha. Digite a senha correta." : "Senha resetada pelo admin. Crie uma nova senha.");
        return;
      }
      const password = document.getElementById("participantPassword")?.value || "";
      if (password.length < 4) return toast("Senha precisa ter pelo menos 4 caracteres");
      state.data.participantPasswords ||= {};
      const passwordHash = await hashParticipantPassword(name, password);
      if (hasParticipantPassword(name)) {
        if (passwordHash !== state.data.participantPasswords[name].hash) return toast("Senha do participante incorreta");
      } else {
        const confirmPassword = document.getElementById("participantPasswordConfirm")?.value || "";
        if (password !== confirmPassword) return toast("As senhas nao conferem");
        state.data.participantPasswords[name] = { hash: passwordHash, createdAt: new Date().toISOString() };
        if (state.data.participantPasswordResets) delete state.data.participantPasswordResets[name];
        saveData({ preserveRemoteParticipants: true });
        toast("Senha criada");

      setSession({ role: "user", name });

    function filteredGames() {
      const user = state.session.name;
      const q = state.query.trim().toLowerCase();
      const originalOrder = new Map(state.data.games.map((game, index) => [game.id, index]));
      const games = state.data.games.filter(g => {
        const pred = getPred(user, g.id);
        const done = !!g.result;
        const locked = isLocked(g);
        const byFilter =
          state.filter === "all" ||
          (state.filter === "pending" && !pred && !locked) ||
          (state.filter === "made" && pred) ||
          (state.filter === "closed" && (locked || done));
        const byQuery = !q || `${g.homeTeam} ${g.awayTeam} ${g.id} ${g.phase}`.toLowerCase().includes(q);
        return byFilter && byQuery;
      });
      const now = Date.now();
      return games.sort((a,b) => {
        const timeA = new Date(a.datetime).getTime();
        const timeB = new Date(b.datetime).getTime();
        if (state.gameOrder === "recent") return timeB - timeA || originalOrder.get(a.id) - originalOrder.get(b.id);
        if (state.gameOrder === "group") return originalOrder.get(a.id) - originalOrder.get(b.id);
        const bucketA = timeA >= now && !a.result ? 0 : 1;
        const bucketB = timeB >= now && !b.result ? 0 : 1;
        return bucketA - bucketB || (bucketA === 0 ? timeA - timeB : timeB - timeA) || originalOrder.get(a.id) - originalOrder.get(b.id);
      });
    }

    function savePrediction(gameId) {
      const game = state.data.games.find(g => g.id === gameId);
      if (isLocked(game)) return toast("Prazo encerrado");
      const homeInput = document.getElementById("predHome").value;
      const awayInput = document.getElementById("predAway").value;
      const home = Number(homeInput);
      const away = Number(awayInput);
      if (homeInput === "" || awayInput === "") return toast(`Voce esqueceu de colocar o placar de ${teamText(game.homeTeam)} x ${teamText(game.awayTeam)}`);
      if (!Number.isInteger(home) || !Number.isInteger(away) || home < 0 || away < 0) return toast("Use gols inteiros e maiores ou iguais a zero");
      if (home > 30 || away > 30) return toast("Confira o placar: gols muito altos parecem erro");
      const stoppageDraft = readOptionalStoppage("predStoppageHome", "predStoppageAway", home, away);
      if (stoppageDraft.error) return toast(stoppageDraft.error);
      const user = state.session.name;
      state.data.predictions[user] ||= {};
      const pred = {
        home,
        away,
        overtime: game.type === "knockout" ? document.getElementById("predOvertime").value === "true" : null,
        advancedTeam: game.type === "knockout" ? document.getElementById("predAdvanced").value : null,
        submittedAt: new Date().toISOString()
      };
      if (stoppageDraft.stoppage) pred.stoppage = stoppageDraft.stoppage;
      if (game.type === "knockout") {
        if (home === away && !pred.overtime) return toast("Se o mata-mata empatar no tempo normal, marque prorrogacao: Sim");
        if (home !== away && pred.overtime) return toast("Prorrogacao so acontece se o tempo normal terminar empatado");
        if (home !== away) pred.advancedTeam = home > away ? game.homeTeam : game.awayTeam;
        if (!pred.advancedTeam) return toast("Escolha quem passa no mata-mata");
      }
      rememberPrediction(state.data, user, gameId, pred);
      saveData({ preserveRemoteParticipants: true });
      toast("Palpite confirmado");
      renderGames();
    }

    function readAdminResultDraft() {
      const game = state.data.games.find(g => g.id === document.getElementById("adminGame").value);
      if (!game) return { error: "Escolha um jogo valido" };
      const homeTeam = document.getElementById("adminHome").value.trim();
      const awayTeam = document.getElementById("adminAway").value.trim();
      if (!homeTeam || !awayTeam) return { error: "Informe os dois times antes de salvar" };
      const home = document.getElementById("resHome").value;
      const away = document.getElementById("resAway").value;
      const homeScore = Number(home);
      const awayScore = Number(away);
      if (home === "" || away === "") return { error: `Voce esqueceu de colocar o placar de ${teamText(homeTeam)} x ${teamText(awayTeam)}` };
      if (!Number.isInteger(homeScore) || !Number.isInteger(awayScore) || homeScore < 0 || awayScore < 0) return { error: "Resultado precisa ter gols inteiros e maiores ou iguais a zero" };
      if (homeScore > 30 || awayScore > 30) return { error: "Confira o resultado: gols muito altos parecem erro" };
      const stoppageDraft = readOptionalStoppage("resStoppageHome", "resStoppageAway", homeScore, awayScore);
      if (stoppageDraft.error) return { error: stoppageDraft.error };
      let wentOvertime = false;
      let advancedTeam = null;
      if (game.type === "knockout") {
        wentOvertime = document.getElementById("wentOvertime").value === "true";
        if (homeScore === awayScore && !wentOvertime) return { error: "Se empatou no tempo normal, marque que foi para prorrogacao" };
        if (homeScore !== awayScore && wentOvertime) return { error: "Prorrogacao so acontece se o tempo normal terminou empatado" };
        advancedTeam = homeScore !== awayScore
          ? (homeScore > awayScore ? homeTeam : awayTeam)
          : document.getElementById("advancedTeam").value;
        if (![homeTeam, awayTeam].includes(advancedTeam)) return { error: "Escolha quem passou depois de atualizar os times" };
      }
      return { game, homeTeam, awayTeam, homeScore, awayScore, stoppage: stoppageDraft.stoppage, wentOvertime, advancedTeam };
    }

    function applyResultDraftToData(data, draft) {
      const game = data.games.find(item => item.id === draft.game.id);
      if (!game) return 0;
      game.homeTeam = draft.homeTeam;
      game.awayTeam = draft.awayTeam;
      game.result = { home: draft.homeScore, away: draft.awayScore };
      if (draft.stoppage) game.result.stoppage = draft.stoppage;
      game.status = "finished";
      if (game.type === "knockout") {
        game.wentOvertime = draft.wentOvertime;
        game.advancedTeam = draft.advancedTeam;
      }
      return updateDerivedTeamsFromResults(data);
    }

    function resultImpactSummary(draft) {
      const beforeRows = scores();
      const simulated = JSON.parse(JSON.stringify(state.data));
      const derivedUpdates = applyResultDraftToData(simulated, draft);
      const afterRows = scores(simulated);
      const beforeByName = Object.fromEntries(beforeRows.map((row, index) => [row.name, { ...row, pos: index + 1 }]));
      const changedRows = afterRows.map((row, index) => {
        const before = beforeByName[row.name] || { total: 0, pos: index + 1 };
        return { ...row, pos: index + 1, deltaPoints: row.total - before.total, deltaPos: before.pos - (index + 1) };
      }).filter(row => row.deltaPoints || row.deltaPos);
      const highlights = changedRows
        .sort((a, b) => Math.abs(b.deltaPoints) - Math.abs(a.deltaPoints) || Math.abs(b.deltaPos) - Math.abs(a.deltaPos))
        .slice(0, 5);
      const predictionCount = state.data.participants.filter(name => getPred(name, draft.game.id)).length;
      const previous = draft.game.result
        ? `${draft.game.result.home} x ${draft.game.result.away}${stoppageSuffix(draft.game.result.stoppage)}${draft.game.advancedTeam ? `, passou ${teamText(draft.game.advancedTeam)}` : ""}`
        : "sem resultado";
      const next = `${draft.homeScore} x ${draft.awayScore}${stoppageSuffix(draft.stoppage)}${draft.advancedTeam ? `, passa ${teamText(draft.advancedTeam)}` : ""}`;
      return {
        previous,
        next,
        predictionCount,
        derivedUpdates,
        highlights,
        simulated
      };
    }

    function resultImpactText(draft, impact) {
      const futureWarning = new Date(draft.game.datetime).getTime() > Date.now()
        ? "\nATENCAO: este jogo ainda nao aconteceu."
        : "";
      const rankLines = impact.highlights.length
        ? impact.highlights.map(row => `- ${row.name}: ${row.deltaPoints >= 0 ? "+" : ""}${row.deltaPoints} pts${row.deltaPos ? `, ${row.deltaPos > 0 ? "sobe" : "cai"} ${Math.abs(row.deltaPos)} pos.` : ""}`).join("\n")
        : "- Ranking nao muda com este resultado.";
      return [
        `Jogo: ${draft.game.id} - ${teamText(draft.homeTeam)} x ${teamText(draft.awayTeam)}`,
        `Atual: ${impact.previous}`,
        `Novo: ${impact.next}`,
        `Palpites afetados: ${impact.predictionCount}`,
        `Vagas futuras atualizadas: ${impact.derivedUpdates}`,
        "",
        "Impacto no ranking:",
        rankLines,
        futureWarning,
        "",
        "Confira com calma antes de confirmar."
      ].filter(Boolean).join("\n");
    }

    function previewResultImpact() {
      const draft = readAdminResultDraft();
      if (draft.error) return toast(draft.error);
      const impact = resultImpactSummary(draft);
      const preview = document.getElementById("resultPreview");
      if (preview) {
        const lines = resultImpactText(draft, impact).split("\n").map(line => escapeHtml(line)).join("<br>");
        preview.innerHTML = `<div class="alert-item alert-warn"><div class="alert-icon">!</div><div><strong>Previa do resultado</strong><span>${lines}</span></div></div>`;
      }
    }

    function saveResult() {
      const draft = readAdminResultDraft();
      if (draft.error) return toast(draft.error);
      const impact = resultImpactSummary(draft);
      const ok = confirm(`${resultImpactText(draft, impact)}\n\nConfirmar e gravar este resultado?`);
      if (!ok) return;
      const derivedUpdates = applyResultDraftToData(state.data, draft);
      saveData();
      toast(derivedUpdates ? "Resultado salvo e mata-mata atualizado" : "Resultado salvo");
      render();
    }

    function addParticipant() {
      const input = document.getElementById("newParticipant");
      const name = input.value.trim().replace(/\s+/g, " ");
      if (!name) return toast("Informe o nome do participante");
      if (name.length < 2) return toast("Nome muito curto");
      if (name.length > 28) return toast("Use um nome mais curto");
      if (state.data.participants.some(p => p.toLowerCase() === name.toLowerCase())) return toast("Nome ja cadastrado");
      if (state.data.participants.length >= 15) return toast("Limite de 15 participantes");
      state.data.participants.push(name);
      saveData();
      render();
    }

    function removeParticipant(index) {
      const name = state.data.participants[index];
      if (!name) return;
      if (!confirm(`Remover ${name} e apagar os palpites dessa pessoa?`)) return;
      state.data.participants = state.data.participants.filter(p => p !== name);
      delete state.data.predictions[name];
      state.data.predictionResets ||= {};
      state.data.predictionResets[name] = new Date().toISOString();
      if (state.data.participantPasswords) delete state.data.participantPasswords[name];
      if (state.data.participantPasswordResets) delete state.data.participantPasswordResets[name];
      saveData();
      render();
    }

    function changePassword() {
      const password = document.getElementById("newPassword").value.trim();
      if (password.length < 4) return toast("Senha precisa ter pelo menos 4 caracteres");
      state.data.adminPassword = password;
      saveData();
      toast("Senha salva");
    }

    function saveBackendConfigNow() {
      const config = {
        provider: "supabase",
        url: document.getElementById("backendUrl").value.trim(),
        anonKey: document.getElementById("backendAnonKey").value.trim(),
        table: document.getElementById("backendTable").value.trim() || DEFAULT_BACKEND_CONFIG.table,
        rowId: document.getElementById("backendRowId").value.trim() || DEFAULT_BACKEND_CONFIG.rowId
      };
      if (config.url && !/^https:\/\/.+/i.test(config.url)) return toast("URL do Supabase precisa comecar com https://");
      if (config.url && !config.anonKey) return toast("Informe a publishable / anon key");
      if (config.anonKey && !config.url) return toast("Informe a URL do Supabase");
      if (!/^[a-z0-9_]+$/i.test(config.table)) return toast("Nome da tabela deve usar letras, numeros e _");
      if (!config.rowId) return toast("Informe o ID do bolao");
      localStorage.setItem(BACKEND_CONFIG_KEY, JSON.stringify(config));
      state.backend.config = getBackendConfig();
      toast("Config do backend salva");
      initBackend();
    }

    function syncNow() {
      if (!backendIsConfigured()) return toast("Configure o backend primeiro");
      pullBackendData({ pushIfMissing: true });
      toast("Sincronizando");
    }

    function clearBackendOverride() {
      localStorage.removeItem(BACKEND_CONFIG_KEY);
      state.backend.config = getBackendConfig();
      toast("Config local limpa");
      initBackend();
    }

    function forcePushLocalData() {
      if (!backendIsConfigured()) return toast("Backend nao configurado");
      const names = state.data.participants.join(", ");
      const ok = confirm(`Enviar os dados deste navegador para o banco?\n\nParticipantes atuais: ${names}\n\nIsso atualiza o bolao para todos.`);
      if (!ok) return;
      touchData();
      persistStateData();
      pushBackendData({ allowParticipantOverwrite: true });
      toast("Enviando para o banco");
    }

    function resetUserPredictions() {
      const user = document.getElementById("resetUser").value;
      if (!user) return toast("Escolha um participante");
      if (!confirm(`Resetar todos os palpites de ${user}?`)) return;
      delete state.data.predictions[user];
      state.data.predictionResets ||= {};
      state.data.predictionResets[user] = new Date().toISOString();
      saveData();
      toast("Palpites resetados");
      render();
    }

    async function resetParticipantPassword() {
      const user = document.getElementById("resetUser").value;
      if (!user) return toast("Escolha um participante");
      await refreshParticipantPasswordFromBackend(user);
      if (backendIsConfigured() && state.backend.status === "offline") return toast("Nao consegui confirmar no banco. Tente resetar de novo.");
      if (!hasParticipantPassword(user)) return toast("Este participante ainda nao tem senha");
      if (!confirm(`Resetar a senha de ${user}? No proximo acesso a pessoa criara uma nova senha.`)) return;
      state.data.participantPasswordResets ||= {};
      state.data.participantPasswordResets[user] = new Date().toISOString();
      delete state.data.participantPasswords[user];
      saveData();
      toast("Senha do participante resetada");
      render();
    }

    function readRulePoints(field) {
      const input = document.getElementById(`score_${field.key}`);
      const raw = (input?.value || "").trim();
      const value = Number(raw);
      if (raw === "" || !Number.isInteger(value) || value < 0) {
        toast(`Informe pontos validos em: ${field.label}`);
        input?.focus();
        return null;
      }
      if (value > 100) {
        toast(`Confira os pontos de: ${field.label}`);
        input?.focus();
        return null;
      }
      return value;
    }

    function readRulesScoring() {
      const scoring = {};
      for (const field of SCORING_FIELDS) {
        const value = readRulePoints(field);
        if (value === null) return null;
        scoring[field.key] = value;
      }
      return scoring;
    }

    function readRulesSummary() {
      const currentSummary = currentRules().summary;
      const summary = currentSummary.map((rule, index) => {
        const title = (document.getElementById(`ruleTitle_${index}`)?.value || "").trim().replace(/\s+/g, " ");
        const description = (document.getElementById(`ruleDescription_${index}`)?.value || "").trim().replace(/\s+/g, " ");
        return title && description ? { id: rule.id || `rule-${index}`, title, description } : null;
      }).filter(Boolean);
      if (!summary.length) {
        toast("Mantenha pelo menos uma regra publica");
        return null;
      }
      return summary;
    }

    function saveRulesConfig() {
      const scoring = readRulesScoring();
      if (!scoring) return;
      const summary = readRulesSummary();
      if (!summary) return;
      state.data.rules = mergeRules({ scoring, summary });
      saveData();
      toast("Regras salvas");
      render();
    }

    function addRule() {
      const title = (document.getElementById("newRuleTitle")?.value || "").trim().replace(/\s+/g, " ");
      const description = (document.getElementById("newRuleDescription")?.value || "").trim().replace(/\s+/g, " ");
      if (title.length < 3) return toast("Informe um titulo para a regra");
      if (description.length < 8) return toast("Detalhe melhor a regra");
      const scoring = readRulesScoring();
      if (!scoring) return;
      const summary = readRulesSummary();
      if (!summary) return;
      summary.push({ id: `custom-${Date.now()}`, title, description });
      state.data.rules = mergeRules({ scoring, summary });
      saveData();
      toast("Regra adicionada");
      render();
    }

    function removeRule(index) {
      const rules = currentRules();
      const rule = rules.summary[index];
      if (!rule) return;
      if (rules.summary.length <= 1) return toast("Mantenha pelo menos uma regra");
      if (!confirm(`Remover a regra "${rule.title}"?`)) return;
      rules.summary.splice(index, 1);
      state.data.rules = mergeRules(rules);
      saveData();
      toast("Regra removida");
      render();
    }

    function resetRulesToDefault() {
      if (!confirm("Voltar para as regras e pontos padrao?")) return;
      state.data.rules = defaultRules();
      saveData();
      toast("Regras padrao restauradas");
      render();
    }

    function viewGamePredictions() {
      const gameId = document.getElementById("adminGame").value;
      const game = state.data.games.find(g => g.id === gameId);
      const rows = state.data.participants.map(p => {
        const pred = getPred(p, gameId);
        const predAdvanced = predictedAdvancedTeam(game, pred);
        return `<tr><td>${escapeHtml(p)}</td><td>${pred ? `${pred.home} x ${pred.away}${stoppageSuffix(pred.stoppage)}` : "Sem palpite"}</td><td>${predAdvanced ? escapeHtml(teamText(predAdvanced)) : ""}</td></tr>`;
      }).join("");
      document.getElementById("adminPreview").innerHTML = `<div class="table-wrap"><table><thead><tr><th>Nome</th><th>Palpite</th><th>Passa</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function shareRanking() {
      const text = scores().map((r,i) => `${i + 1}. ${r.name} - ${r.total} pts (${r.exact} exatos, ${r.correct} corretos)`).join("\n");
      navigator.clipboard?.writeText("Ranking do Bolao da Copa 2026\n\n" + text).then(() => toast("Ranking copiado")).catch(() => {
        prompt("Copie o ranking:", text);
      });
    }

    function requestNotifications() {
      if (!("Notification" in window)) return toast("Navegador sem notificacoes");
      Notification.requestPermission().then(permission => {
        toast(permission === "granted" ? "Notificacoes ativadas" : "Permissao negada");
        scheduleNotifications();
      });
    }

    function installHintText() {
      if (deferredInstallPrompt) return "Seu navegador ja liberou a instalacao.";
      if (navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) return "O app ja esta instalado.";
      return "No iPhone: Compartilhar > Adicionar a Tela de Inicio. No Android: menu do navegador > Instalar app.";
    }

    async function installApp() {
      if (navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) {
        return toast("App ja instalado");
      }
      if (!deferredInstallPrompt) {
        return toast("Use o menu do navegador para instalar");
      }
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      toast(choice.outcome === "accepted" ? "Instalacao iniciada" : "Instalacao cancelada");
      renderLogin();
    }

    function scheduleNotifications() {
      if (!("Notification" in window) || Notification.permission !== "granted" || !state.session) return;
      const user = state.session.name;
      state.data.games.forEach(game => {
        if (getPred(user, game.id)) return;
        [24, 2].forEach(hours => {
          const when = new Date(game.datetime).getTime() - hours * 3600000;
          const delay = when - Date.now();
          if (delay > 0 && delay < 2147483647) {
            setTimeout(() => {
              if (!getPred(user, game.id)) new Notification("Bolao da Copa 2026", { body: `${hours}h para ${teamText(game.homeTeam)} x ${teamText(game.awayTeam)}. Faca seu palpite!` });
            }, delay);
          }
        });
      });
    }

    function bump(id, diff) {
      const input = document.getElementById(id);
      input.value = Math.max(0, Number(input.value || 0) + diff);
    }
    function setFilter(id) { state.filter = id; renderGames(); }
    function setGameOrder(id) { state.gameOrder = id; renderGames(); }
    function setQuery(value) { state.query = value; renderGames(); }
    function go(id) { state.view = id; render(); }
    function goAdminGame(id) { state.view = "admin"; render(); document.getElementById("adminGame").value = id; fillAdminGame(); }
    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1800);
    }

    document.getElementById("themeBtn").addEventListener("click", () => {
      state.data.settings ||= {};
      state.data.settings.theme = state.data.settings.theme === "light" ? "dark" : "light";
      saveData();
      render();
    });
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("bolaoSession");
      state.session = null;
      state.view = "login";
      toast("Sessao encerrada. Confira o nome antes de entrar.");
      render();
    });
    document.getElementById("notifyBtn").addEventListener("click", requestNotifications);

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      if (state.view === "login") renderLogin();
    });

    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      toast("App instalado");
      if (state.view === "login") renderLogin();
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(registration => {
          registration.update();
          setInterval(() => registration.update(), 60 * 60 * 1000);
        }).catch(() => {});
      });
    }

    setInterval(() => {
      if (state.session && (state.view === "games" || state.view === "dashboard")) render();
    }, 60000);

    if (state.session) state.view = "dashboard";
    initBackend();
    initResultAutoUpdate();
    scheduleNotifications();
    render();
  </script>
</body>
</html>
